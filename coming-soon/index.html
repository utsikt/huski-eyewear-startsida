    html, body { margin: 0; height: 100%; background: #FDF7F4; overflow: hidden; }
    a { color: #DA291C; } a:hover { color: #B01F16; }
    ::selection { background: #DA291C; color: #FFFFFF; }
    .m { font-family: 'Archivo', system-ui, sans-serif; font-weight: 300; letter-spacing: .30em;
         text-transform: uppercase; color: #111111; line-height: 1.9; white-space: nowrap; }
    .display { font-family: 'HUSKI Sans Hero', system-ui, sans-serif; font-weight: 400; letter-spacing: 0; }

    /* Sidan ar Tonys ritbord, godkant 2026-09-08, skalat sa att det tacker fonstret.
       Bredden styr skalan, hojden foljer fonstret. Dator 1440 x 900, mobil 390 x 844. */
    .stage { position: fixed; left: 0; top: 0; }
    #desk { width: 1440px; }
    #mob  { width: 390px;  display: none; }
    @media (max-width: 820px) { #desk { display: none; } #mob { display: block; } }


    /* Organiskt filmkorn framfor bilden. Kornet ligger under texterna. */
    .grain { position: absolute; inset: -10%; pointer-events: none; z-index: 5; opacity: .40;
             mix-blend-mode: soft-light;
             background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
             background-size: 300px 300px; }
    @media (prefers-reduced-motion: no-preference) {
      .grain { animation: korn .5s steps(6) infinite; }
      @keyframes korn {
        0% { transform: translate(0,0); } 17% { transform: translate(-3%,2%); } 33% { transform: translate(2%,-4%); }
        50% { transform: translate(-4%,-1%); } 67% { transform: translate(3%,3%); } 83% { transform: translate(-1%,-3%); } 100% { transform: translate(0,0); }
      }
    }
    @property --paint { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
    @media (prefers-reduced-motion: no-preference) {
      .eyebar {
        -webkit-mask-image: linear-gradient(90deg, #000 0 calc(var(--paint) - 7%), rgba(0,0,0,.55) calc(var(--paint) - 2%), transparent calc(var(--paint) + 3%));
        mask-image: linear-gradient(90deg, #000 0 calc(var(--paint) - 7%), rgba(0,0,0,.55) calc(var(--paint) - 2%), transparent calc(var(--paint) + 3%));
        animation: paint .62s cubic-bezier(.16,.9,.3,1) .65s forwards;
      }
      @keyframes paint { from { --paint: 0%; } to { --paint: 112%; } }
      /* HUSKI EYEWEAR skrivs fram nar balken ar malad, ett tecken i taget */
      .eyetext { clip-path: inset(0 100% 0 0); animation: typ .68s steps(13, end) 1.3s forwards; }
      @keyframes typ { to { clip-path: inset(0 0 0 0); } }
      .m { opacity: 0; animation: appear .5s ease-out 2.0s forwards; }
      @keyframes appear { to { opacity: 1; } }
    }
  </style>

<script>
  function fit() {
    var w = innerWidth, h = innerHeight, m = w <= 820;
    var el = document.getElementById(m ? 'mob' : 'desk');
    // Bredden styr skalan. Hojden foljer fonstret, sa inget kapas: heron vaxer nerat.
    var s = w / (m ? 390 : 1440);
    el.style.zoom = s;
    el.style.height = (h / s) + 'px';
  }
  addEventListener('resize', fit); fit();
</script>
